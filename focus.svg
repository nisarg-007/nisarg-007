</style><rect width="1200" height="310" fill="#F6F4EF"/><rect x="0" y="0" width="1200" height="310" fill="#ECE9E1"/><text x="72" y="74" font-size="13" letter-spacing="2.6" class="m">WHAT I BUILD</text><text x="72" y="124" font-size="36" class="d">Messy input, defensible output.</text><g class="in" style="animation-delay:0.00s"><line x1="72" y1="166" x2="404" y2="166" stroke="#14524A" stroke-width="2"/><text x="72" y="196" font-size="17" class="b">Aviation safety</text><text x="72" y="226" font-size="14.5">NASA ASRS narratives parsed</text><text x="72" y="250" font-size="14.5">from PDF, joined to real BTS</text><text x="72" y="274" font-size="14.5">flight records, ranked for</text><text x="72" y="298" font-size="14.5">analysts on SQS and Fargate.</text></g><g class="in" style="animation-delay:0.09s"><line x1="434" y1="166" x2="766" y2="166" stroke="#14524A" stroke-width="2"/><text x="434" y="196" font-size="17" class="b">Aerial imagery</text><text x="434" y="226" font-size="14.5">Classical pipeline over 1m NAIP</text><text x="434" y="250" font-size="14.5">imagery of Houston. CLAHE held</text><text x="434" y="274" font-size="14.5">0.87 local contrast against 0.66</text><text x="434" y="298" font-size="14.5">for global equalisation.</text></g><g class="in" style="animation-delay:0.18s"><line x1="796" y1="166" x2="1128" y2="166" stroke="#14524A" stroke-width="2"/><text x="796" y="196" font-size="17" class="b">Operational data</text><text x="796" y="226" font-size="14.5">A 16 table procurement system</text><text x="796" y="250" font-size="14.5">in third normal form, with every</text><text x="796" y="274" font-size="14.5">mutation written to a central</text><text x="796" y="298" font-size="14.5">audit log.</text></g></svg>