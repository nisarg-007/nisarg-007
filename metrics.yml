name: Generate Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - theme: light
            suffix: ""
          - theme: dark
            suffix: "-dark"
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview${{ matrix.suffix }}.svg
          user: nisarg-007
          template: classic
          base: header, activity, community, repositories
          config_theme: ${{ matrix.theme }}
          config_timezone: America/Chicago

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages${{ matrix.suffix }}.svg
          user: nisarg-007
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_theme: ${{ matrix.theme }}
          config_timezone: America/Chicago

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/calendar${{ matrix.suffix }}.svg
          user: nisarg-007
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_theme: ${{ matrix.theme }}
          config_timezone: America/Chicago
