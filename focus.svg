<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">What I build</title><desc id="d">What I build. Aviation safety: NASA ASRS narratives parsed from PDF, joined to real BTS flight records, ranked for analysts on SQS and Fargate. Aerial imagery: classical pipeline over 1 metre NAIP imagery of Houston, CLAHE held 0.87 local contrast against 0.66 for global equalisation. Operational data: a 16 table procurement system in third normal form with every mutation written to a central audit log.</desc><style>@font-face{font-family:Ds;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Sn;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Sb;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
